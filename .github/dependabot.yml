# Dependabot — Sprint 4 CI hardening.
# Weekly dependency PRs for npm + GitHub Actions. No runtime impact:
# Dependabot only opens PRs; nothing merges automatically.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "sprint4"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["ci", "sprint4"]