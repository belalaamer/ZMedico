name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Typecheck and production build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start app for public mobile smoke
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 8080 > /tmp/zmedico-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zmedico-vite.log
          exit 1

      - name: Public mobile smoke (320 / 390 / 430)
        run: >
          bunx playwright test
          --project="public-mobile:compact-320"
          --project="public-mobile:iphone-14"
          --project="public-mobile:iphone-15-pro-max"

      - name: Authenticated Admin E2E (when configured)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_EMAIL:-}" ] || [ -z "${ADMIN_PASS:-}" ]; then
            echo "::warning title=Authenticated E2E not active::Add repository secrets ADMIN_EMAIL and ADMIN_PASS so PRs are blocked when authenticated core routes regress."
            exit 0
          fi

          BASE_URL=http://127.0.0.1:8080 bunx playwright test \
            --project=admin-desktop \
            --project=admin-mobile

      - name: Deep RBAC / RLS E2E (when configured)
        env:
          BASE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          BASE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          MANAGER_EMAIL: ${{ secrets.MANAGER_EMAIL }}
          MANAGER_PASS: ${{ secrets.MANAGER_PASS }}
          DOCTOR_EMAIL: ${{ secrets.DOCTOR_EMAIL }}
          DOCTOR_PASS: ${{ secrets.DOCTOR_PASS }}
          NURSE_EMAIL: ${{ secrets.NURSE_EMAIL }}
          NURSE_PASS: ${{ secrets.NURSE_PASS }}
          RECEPTIONIST_EMAIL: ${{ secrets.RECEPTIONIST_EMAIL }}
          RECEPTIONIST_PASS: ${{ secrets.RECEPTIONIST_PASS }}
          ACCOUNTANT_EMAIL: ${{ secrets.ACCOUNTANT_EMAIL }}
          ACCOUNTANT_PASS: ${{ secrets.ACCOUNTANT_PASS }}
          HR_EMAIL: ${{ secrets.HR_EMAIL }}
          HR_PASS: ${{ secrets.HR_PASS }}
        run: |
          set -euo pipefail
          required=(BASE_SUPABASE_URL BASE_SUPABASE_ANON_KEY ADMIN_EMAIL ADMIN_PASS MANAGER_EMAIL MANAGER_PASS DOCTOR_EMAIL DOCTOR_PASS NURSE_EMAIL NURSE_PASS RECEPTIONIST_EMAIL RECEPTIONIST_PASS ACCOUNTANT_EMAIL ACCOUNTANT_PASS HR_EMAIL HR_PASS)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning title=Deep RBAC E2E not active::Missing QA secrets: ${missing[*]}"
            exit 0
          fi
          bunx playwright test --project=rbac-deep

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-mobile-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
