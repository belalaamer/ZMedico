name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Typecheck and production build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start app for public mobile smoke
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 8080 > /tmp/zmedico-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zmedico-vite.log
          exit 1

      - name: Public mobile smoke (320 / 390 / 430)
        run: >
          bunx playwright test
          --project="public-mobile:compact-320"
          --project="public-mobile:iphone-14"
          --project="public-mobile:iphone-15-pro-max"

      - name: Authenticated Admin + RBAC/RLS E2E
        env:
          ADMIN_EMAIL: qa.admin@qa.local
          ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_MANAGER_PASSWORD: ${{ secrets.TEST_MANAGER_PASSWORD }}
          TEST_DOCTOR_PASSWORD: ${{ secrets.TEST_DOCTOR_PASSWORD }}
          TEST_NURSE_PASSWORD: ${{ secrets.TEST_NURSE_PASSWORD }}
          TEST_RECEPTIONIST_PASSWORD: ${{ secrets.TEST_RECEPTIONIST_PASSWORD }}
          TEST_ACCOUNTANT_PASSWORD: ${{ secrets.TEST_ACCOUNTANT_PASSWORD }}
          TEST_HR_PASSWORD: ${{ secrets.TEST_HR_PASSWORD }}
        run: |
          set -euo pipefail
          required=(TEST_ADMIN_PASSWORD TEST_MANAGER_PASSWORD TEST_DOCTOR_PASSWORD TEST_NURSE_PASSWORD TEST_RECEPTIONIST_PASSWORD TEST_ACCOUNTANT_PASSWORD TEST_HR_PASSWORD)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Authenticated RBAC E2E required::Missing QA password secrets: ${missing[*]}"
            exit 1
          fi

          # Supabase URL + publishable key are public client configuration,
          # so reuse the committed Vite environment instead of duplicating
          # them as GitHub secrets.
          set -a
          source .env
          set +a
          export BASE_SUPABASE_URL="${VITE_SUPABASE_URL:-}"
          export BASE_SUPABASE_ANON_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_ANON_KEY:-}}"

          BASE_URL=http://127.0.0.1:8080 bunx playwright test \
            --project=admin-desktop \
            --project=admin-mobile \
            --project=rbac-ui \
            --project=rbac-deep

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-mobile-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
