name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Typecheck and production build
        run: bun run build

      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-only-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-only-

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # This step used to serve `bun run dev`, which is not the artifact deploy.yml
      # publishes. On 2026-10-29 the rollup merge (#236) passed all 52 smoke tests
      # against the dev server and then failed `every booking step fits the screen
      # edge to edge (en)` against `bun run preview` on the same commit: the dev
      # server takes ~700 ms longer to paint, the web font swaps in during that
      # window, and the Inter metrics fit 320 px while the pre-swap fallback metrics
      # do not. A gate that runs against a different artifact than the one that
      # ships cannot see that class of defect, so CI now serves the build itself.
      - name: Start the built app for public mobile smoke
        shell: bash
        run: |
          bun run preview --host 127.0.0.1 --port 8080 > /tmp/zmedico-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zmedico-preview.log
          exit 1

      # 360 is here because the booking step indicator was audited at 360 px and
      # this list did not contain it: the wrap boundary between one row and two
      # can sit anywhere in that gap, so 320 does not stand in for 360.
      - name: Public mobile smoke (320 / 360 / 390 / 430)
        run: >
          bunx playwright test
          --project="public-mobile:compact-320"
          --project="public-mobile:pixel"
          --project="public-mobile:iphone-14"
          --project="public-mobile:iphone-15-pro-max"

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-mobile-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
