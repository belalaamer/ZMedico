name: Database tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: supabase test db
