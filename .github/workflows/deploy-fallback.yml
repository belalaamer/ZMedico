name: Deploy to Cloudflare (fallback runner)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -gt 10
          echo "Build output verified."

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -euo pipefail
          sleep 10
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/zmedico-home.html -w "%{http_code}" https://zmedico2.belalaamer.workers.dev/ || true)
            if [ "$code" = "200" ] && grep -q '<div id="root"' /tmp/zmedico-home.html; then
              echo "Smoke test passed."
              exit 0
            fi
            echo "Attempt $i: HTTP $code"
            sleep 10
          done
          echo "Smoke test failed."
          exit 1
