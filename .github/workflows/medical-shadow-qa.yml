name: Medical Records Shadow QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  medical-shadow-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ secrets.BASE_URL }}

      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      TEST_DOCTOR_EMAIL: ${{ secrets.TEST_DOCTOR_EMAIL }}
      TEST_DOCTOR_PASSWORD: ${{ secrets.TEST_DOCTOR_PASSWORD }}

      TEST_MANAGER_EMAIL: ${{ secrets.TEST_MANAGER_EMAIL }}
      TEST_MANAGER_PASSWORD: ${{ secrets.TEST_MANAGER_PASSWORD }}

      TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
      TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Verify required secrets
        shell: bash
        run: |
          required=(
            BASE_URL
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            TEST_ADMIN_EMAIL
            TEST_ADMIN_PASSWORD
            TEST_DOCTOR_EMAIL
            TEST_DOCTOR_PASSWORD
            TEST_MANAGER_EMAIL
            TEST_MANAGER_PASSWORD
            TEST_STAFF_EMAIL
            TEST_STAFF_PASSWORD
          )

          missing=0

          for var in "${required[@]}"; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing secret: $var"
              missing=1
            else
              echo "✅ $var"
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Print Playwright version
        run: |
          npx playwright --version

      - name: Run Medical Records Shadow QA
        run: |
          npx playwright test \
            --project=setup:shadow-medical \
            --project=medical-shadow-walk \
            --project=medical-shadow-validate

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      - name: Upload Shadow Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-reports
          path: tests/playwright/.shadow-reports
          if-no-files-found: ignore