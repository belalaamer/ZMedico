name: Playwright install test (temporary)

on:
  push:
    branches: [fix/deploy-playwright-install-20261119]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-webkit-

      - name: Install Playwright system dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          start=$(date +%s)
          bunx playwright install-deps chromium webkit
          echo "system_deps_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium and WebKit browsers
        timeout-minutes: 8
        run: |
          set -euo pipefail
          start=$(date +%s)
          bunx playwright install chromium webkit
          echo "browser_install_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify installed browsers
        run: |
          set -euo pipefail
          bunx playwright --version
          test -d "$HOME/.cache/ms-playwright"
          ls -1 "$HOME/.cache/ms-playwright"
