name: Shadow QA (matrix)

# Consolidates the previous per-slice workflows
# (hr / invoices / medical / patients / settings) into a single matrix
# job. Each matrix leg is byte-equivalent to the old workflow: same
# environment variables, same playwright projects, same artifacts.
#
# Rollback: restore the five deleted workflow files from git history.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  shadow-qa:
    name: ${{ matrix.slice }} shadow QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: settings
            setup_project: "setup:shadow"
            walk_project: "settings-shadow-walk"
            validate_project: "settings-shadow-validate"
            extra_role_secrets: '["TEST_MANAGER_EMAIL","TEST_MANAGER_PASSWORD","TEST_ACCOUNTANT_EMAIL","TEST_ACCOUNTANT_PASSWORD","TEST_STAFF_EMAIL","TEST_STAFF_PASSWORD"]'
          - slice: patients
            setup_project: "setup:shadow-patients"
            walk_project: "patients-shadow-walk"
            validate_project: "patients-shadow-validate"
            extra_role_secrets: '["TEST_MANAGER_EMAIL","TEST_MANAGER_PASSWORD","TEST_RECEPTIONIST_EMAIL","TEST_RECEPTIONIST_PASSWORD","TEST_STAFF_EMAIL","TEST_STAFF_PASSWORD"]'
          - slice: medical
            setup_project: "setup:shadow-medical"
            walk_project: "medical-shadow-walk"
            validate_project: "medical-shadow-validate"
            extra_role_secrets: '["TEST_DOCTOR_EMAIL","TEST_DOCTOR_PASSWORD","TEST_MANAGER_EMAIL","TEST_MANAGER_PASSWORD","TEST_STAFF_EMAIL","TEST_STAFF_PASSWORD"]'
          - slice: hr
            setup_project: "setup:shadow-hr"
            walk_project: "hr-shadow-walk"
            validate_project: "hr-shadow-validate"
            extra_role_secrets: '["TEST_HR_EMAIL","TEST_HR_PASSWORD","TEST_MANAGER_EMAIL","TEST_MANAGER_PASSWORD","TEST_STAFF_EMAIL","TEST_STAFF_PASSWORD"]'
          - slice: invoices
            setup_project: "setup:shadow-invoices"
            walk_project: "invoices-shadow-walk"
            validate_project: "invoices-shadow-validate"
            extra_role_secrets: '["TEST_ACCOUNTANT_EMAIL","TEST_ACCOUNTANT_PASSWORD","TEST_RECEPTIONIST_EMAIL","TEST_RECEPTIONIST_PASSWORD","TEST_STAFF_EMAIL","TEST_STAFF_PASSWORD"]'

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_MANAGER_EMAIL: ${{ secrets.TEST_MANAGER_EMAIL }}
      TEST_MANAGER_PASSWORD: ${{ secrets.TEST_MANAGER_PASSWORD }}
      TEST_ACCOUNTANT_EMAIL: ${{ secrets.TEST_ACCOUNTANT_EMAIL }}
      TEST_ACCOUNTANT_PASSWORD: ${{ secrets.TEST_ACCOUNTANT_PASSWORD }}
      TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
      TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
      TEST_RECEPTIONIST_EMAIL: ${{ secrets.TEST_RECEPTIONIST_EMAIL }}
      TEST_RECEPTIONIST_PASSWORD: ${{ secrets.TEST_RECEPTIONIST_PASSWORD }}
      TEST_DOCTOR_EMAIL: ${{ secrets.TEST_DOCTOR_EMAIL }}
      TEST_DOCTOR_PASSWORD: ${{ secrets.TEST_DOCTOR_PASSWORD }}
      TEST_HR_EMAIL: ${{ secrets.TEST_HR_EMAIL }}
      TEST_HR_PASSWORD: ${{ secrets.TEST_HR_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify required secrets
        shell: bash
        run: |
          required=(BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD)
          missing=0
          for var in "${required[@]}"; do
            if [ -z "${!var}" ]; then echo "❌ Missing secret: $var"; missing=1;
            else echo "✅ $var"; fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.slice }} Shadow QA
        run: |
          npx playwright test \
            --project=${{ matrix.setup_project }} \
            --project=${{ matrix.walk_project }} \
            --project=${{ matrix.validate_project }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.slice }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.slice }}
          path: test-results
          if-no-files-found: ignore

      - name: Upload Shadow Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-reports-${{ matrix.slice }}
          path: tests/playwright/.shadow-reports
          if-no-files-found: ignore