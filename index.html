<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is not decoration: ten declarations across eight
         files read env(safe-area-inset-*), and without it the viewport stops
         short of the notch/home indicator, so every one of those resolves to 0
         and the bottom nav sits under the gesture bar on iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>ZMedico</title>
    <meta name="description" content="ZMedico is an all-in-one clinic management system for every specialty: patients, appointments, invoices and branches in one place.">
    <meta name="author" content="ZMedico" />

    <!-- public/robots.txt deliberately lets Twitterbot and facebookexternalhit
         in, so these tags are the product's public face. og:image used to point
         at a 429 KB PNG on Lovable's public r2.dev dev bucket — a host ZMedico
         does not control, and if it were ever purged every chat and search
         preview would break. The same brand image now ships from /public and is
         read from this origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZMedico" />
    <meta property="og:url" content="https://zmedico.com/" />
    <meta property="og:title" content="ZMedico">
    <meta property="og:description" content="ZMedico is an all-in-one clinic management system for every specialty: patients, appointments, invoices and branches in one place.">
    <meta property="og:image" content="https://zmedico.com/og-image.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZMedico">
    <meta name="twitter:description" content="ZMedico is an all-in-one clinic management system for every specialty: patients, appointments, invoices and branches in one place.">
    <meta name="twitter:image" content="https://zmedico.com/og-image.png">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
